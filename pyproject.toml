[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ptyguy"
version = "0.1.0.dev0"
description = "Orchestrator for ptychography reconstructions at EPICS/Tango beamlines"
requires-python = ">=3.9"
dependencies = ["pyyaml", "caproto"]

[project.optional-dependencies]
dev = ["pytest", "h5py", "numpy"]

[tool.setuptools.packages.find]
include = ["ptyguy*"]

[tool.pytest.ini_options]
testpaths = ["tests", "sim/tests"]
