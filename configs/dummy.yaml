# Signal mapping for the dummy beamline (sim/dummy_beamline.py).
# Left: PtyGuy's logical signal. Right: where this beamline keeps it.
beamline: dummy
control_system: epics

signals:
  scan_state:
    pv: DUMMY:SCAN:STATE
    states:                     # logical state: beamline value(s)
      idle: IDLE
      running: RUNNING
      done: DONE
      aborted: ABORTED
  scan_number:       {pv: DUMMY:SCAN:NUMBER}
  file_path:         {pv: DUMMY:DET:FILEPATH, type: string}
  writing:           {pv: DUMMY:DET:WRITING}
  energy:            {pv: DUMMY:OPT:ENERGY, unit: eV}
  probe_size:        {pv: DUMMY:OPT:PROBE:SIZE, unit: um}
  detector_distance: {pv: DUMMY:DET:DISTANCE, unit: m}
  pixel_size:        {pv: DUMMY:DET:PIXEL_SIZE, unit: um}
  npoints:           {pv: DUMMY:SCAN:NPOINTS}
  scan_type:         {pv: DUMMY:SCAN:TYPE}
  step:              {pv: DUMMY:SCAN:STEP, unit: um}

options:
  file_stable_s: 2         # no 'writing' signal: file size unchanged this long = ready
  file_timeout_s: 300      # scan done but file not ready after this long: INCOMPLETE

# Where things are in the scan files (HDF5). Check it on a real file:
#   python -m ptyguy check-data configs/dummy.yaml sim/scans/scan_00001.h5
data:
  format: hdf5
  frames:    {path: entry/data/data}
  positions: {path: entry/data/positions_um, unit: um, order: yx}
  geometry:                       # from: event = PV value at scan start; path = also in the file
    energy:            {from: event, path: entry/instrument, attr: energy_eV, unit: eV}
    detector_distance: {from: event, path: entry/instrument, attr: detector_distance_m, unit: m}
    pixel_size:        {from: event, path: entry/instrument, attr: pixel_size_um, unit: um}
